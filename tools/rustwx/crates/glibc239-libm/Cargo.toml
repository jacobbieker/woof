# glibc 2.39's binary64 libm, transcribed so that a double result is the
# same bits on every platform: exp, log, log10, pow, sin, cos, tan, atan,
# atan2, asin and acos as glibc 2.39 computes them on x86-64 with FMA, the
# C library WRF's reference fixtures were computed against.
#
# Rust's f64 `sin`, `powf`, `atan2` and friends call the platform C library.
# macOS's libm, the Windows UCRT and other glibc releases return different
# last bits for the same argument, so static grid geometry and host-side
# setup graded against those fixtures came out differently by host.
#
# Mixed licence, by file (see src/lib.rs and the repository NOTICE): the
# IBM Accurate Mathematical Library parts (sin, cos, tan, atan, atan2, asin,
# acos) are LGPL-2.1-or-later as glibc distributes them; exp, log and pow
# are Arm optimized-routines under MIT; log10 is FDLIBM under Sun's notice.
# No dependencies.
[package]
name = "glibc239-libm"
version = "0.1.0"
edition.workspace = true
license = "LGPL-2.1-or-later AND MIT AND SunPro"
publish.workspace = true
rust-version.workspace = true
