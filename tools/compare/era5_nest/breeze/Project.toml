# Julia environment for the Breeze MC3E timing driver (breeze_mc3e_timing.jl).
# The same package set and compat as NumericalEarth.jl's examples/Project.toml
# at commit 66112eac, minus the plotting packages the timing driver does not
# load.  NumericalEarth itself is added from a source checkout with
# Pkg.develop(path=...) by tools/compare/era5_nest/breeze_setup.sh.
[deps]
Breeze = "660aa2fb-d4c8-4359-a52c-9c057bc511da"
CUDA = "052768ef-5323-5732-b1bb-66c8b64840ba"
CloudMicrophysics = "6a9e3e04-43cd-43ba-94b9-e8782df3c71b"
CopernicusClimateDataStore = "bce3f73f-acea-4481-bd86-df89ecc2cb46"
Dates = "ade2ca70-3891-5945-98fb-dc099432e06a"
Oceananigans = "9e8cae18-63c1-5223-a75c-80ca9d6e9a09"
Printf = "de0858da-6303-5e67-8744-51eddeeeb8d7"
RRTMGP = "a01a1ee8-cea4-48fc-987c-fc7878d79da1"

[compat]
Breeze = "0.12"
CopernicusClimateDataStore = "0.2"
CUDA = "6"
Oceananigans = "0.113"
