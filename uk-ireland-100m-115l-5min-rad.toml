# PHYSICS: thompson-mp8-mynn-mynn-ruc-rte-rrtmgp-implemented-unverified-v1: mp_physics 8, longwave RTE+RRTMGP, shortwave RTE+RRTMGP (radt 12 min), NO cumulus parameterization, bl_pbl_physics 5, sf_surface_physics 3.
# Taken verbatim from woof.physics_compat, so this file passes the prepared-
# forecast runner's profile guard as emitted.  Child dx/dt derive exactly from
# the parent chain and are never hand-typed (woof/experiment.py).
# NOCTURNALLY VALID: longwave and shortwave both run, so the surface longwave
# budget stays closed through the night.
# GRAY ZONE: 1 domain(s) refine below 1 km (finest 100 m) with the 1-D PBL scheme bl_pbl_physics = 5 active, so boundary-layer eddies are partly resolved by the dynamics and simultaneously parameterized as if they were not. The proper tool at these scales is a 3-D turbulence closure with the PBL off: set km_opt = 3 (3-D Smagorinsky) or km_opt = 2 (1.5-order prognostic TKE) with bl_pbl_physics = 0 AND mix_isotropic = 1 on the domain(s) below the gray zone -- both are per-domain, so a PBL parent can carry a PBL-off child (see docs/public/LES.md) -- or the SASE closure (bl_pbl_physics = 900), which is implemented and selectable but EXPERIMENTAL and not WRF-verified. mix_isotropic = 1 is part of that recipe and not an optional extra: km_opt 2 and 3 with mix_isotropic = 0 (WRF's default; left unset, WOOF auto-selects 1 where the criterion below fails, and says so) build the vertical exchange coefficient on the LAYER DEPTH and then hand it to the horizontal diffusion of w, and the reachable mix_upper_bound*(dz_max/dx)^2 rises as the grid narrows while the layers do not -- it reads 0.702 on this project's own 250 m LES child against a limit of 0.25, which is the tier where the horizontal mixing of w amplifies a 2-grid-interval mode instead of damping it. Choose it at t = 0: mix_isotropic is inside the RunConfig restart fingerprint, so it cannot be changed part-way through a campaign you intend to resume. Until you do, treat sub-kilometre PBL structure as indicative rather than quantitative.

