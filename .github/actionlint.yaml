self-hosted-runner:
  # The opt-in CUDA runner of tests.yml (docs/dev/ci.md).
  labels:
    - cuda
paths:
  # The release workflows stay byte-for-byte (their file names are bound to
  # PyPI trusted publishing); shellcheck's SC2012 note on their `ls` is
  # informational, and the hosted runner has shellcheck where a dev box may not.
  .github/workflows/publish.yml:
    ignore:
      - 'SC2012'
  .github/workflows/publish-data.yml:
    ignore:
      - 'SC2012'
  # `concurrency.queue: max` (GitHub's newer concurrency key, kept so a pending
  # manual publish is never dropped) is not in actionlint 1.7.12's schema, the
  # newest on conda-forge.  Ignore exactly that message; drop this once
  # actionlint learns the key.
  .github/workflows/publish-metal.yml:
    ignore:
      - 'unexpected key "queue" for "concurrency" section'
