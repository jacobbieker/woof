name: publish-metal

# metal-woof: this source built for Apple silicon and published to PyPI.
#
# A macOS arm64 platform wheel carrying the macOS Rust bridges, with the MLX
# backend's requirements in its base dependencies, plus the matching sdist.
# The distribution is renamed at build time (tools/metal_woof_project.py);
# recast-woof's own release workflows (publish.yml, publish-data.yml) are
# untouched.  Publishing is PyPI trusted publishing: project metal-woof,
# this workflow file, environment pypi-metal (docs/dev/ci.md).
#
# A tag `metal-vX.Y.Z[.N]` builds, smoke-tests and publishes X.Y.Z[.N].  A
# manual run builds and smoke-tests the version it is given and publishes
# only when `publish` is ticked.

on:
  push:
    tags: ["metal-v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "metal-woof version to build, for example 1.1.3.1"
        required: true
      publish:
        description: "upload the built distributions to PyPI"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: publish-metal-${{ github.ref_name }}-${{ inputs.version }}
  cancel-in-progress: false

env:
  PIXI_VERSION: v0.81.0
  PYTHONUNBUFFERED: "1"

jobs:
  build:
    name: build (macos-15, arm64)
    runs-on: macos-15
    timeout-minutes: 180
    env:
      # The wheel is tagged macosx_14_0_arm64 (setup.py PLATFORM_TAGS), so
      # every bridge is linked for macOS 14 or newer.
      MACOSX_DEPLOYMENT_TARGET: "14.0"
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - id: version
        name: the version this run builds
        env:
          REF_NAME: ${{ github.ref_name }}
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          if [ "${GITHUB_EVENT_NAME}" = push ]; then
            version="${REF_NAME#metal-v}"
          else
            version="${INPUT_VERSION}"
          fi
          if ! printf '%s' "$version" | grep -Eq '^[0-9]+(\.[0-9]+)+$'; then
            echo "::error::version '$version' is not a release number (tag metal-vX.Y.Z[.N])"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - uses: prefix-dev/setup-pixi@ad1da6449d9e506fd127fd67ab2d054a769f6a94 # v0.11.2
        with:
          pixi-version: ${{ env.PIXI_VERSION }}
          environments: mlx
          activate-environment: mlx
          locked: true
          cache: true
          cache-write: false
      - id: workspaces
        name: workspaces (the build-native pixi task)
        run: |
          {
            echo 'list<<EOF'
            python .github/ci/build_native.py list | sed 's|.*|tools/& -> target|'
            echo EOF
          } >> "$GITHUB_OUTPUT"
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: ${{ steps.workspaces.outputs.list }}
          shared-key: publish-metal
          save-if: false
      - name: cargo build --release --locked --offline (every build-native workspace)
        run: python .github/ci/build_native.py build
      - name: rename the distribution to metal-woof
        run: python tools/metal_woof_project.py --version "${{ steps.version.outputs.version }}"
      - name: a clean build environment
        run: |
          /usr/bin/python3 -m venv "$RUNNER_TEMP/build-env"
          "$RUNNER_TEMP/build-env/bin/python" -m pip install --quiet --upgrade pip build
      # The sdist first, from an unstaged tree: setup.py refuses an sdist
      # while a platform's binaries are staged.
      - name: sdist
        run: |
          python tools/stage_wheel_bridges.py --clean
          "$RUNNER_TEMP/build-env/bin/python" -m build --sdist --outdir dist
      - name: stage the macOS bridges into the package
        run: python tools/stage_wheel_bridges.py --platform macos-arm64
      - name: platform wheel
        run: "\"$RUNNER_TEMP/build-env/bin/python\" -m build --wheel --outdir dist"
      - name: the distributions are metal-woof's, and the wheel is macOS arm64
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          ls -l dist
          test -f "dist/metal_woof-${VERSION}.tar.gz"
          test -f "dist/metal_woof-${VERSION}-py3-none-macosx_14_0_arm64.whl"
          test "$(find dist -mindepth 1 -maxdepth 1 | wc -l | tr -d ' ')" = 2
          (cd dist && shasum -a 256 ./* | tee ../SHA256SUMS)
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: metal-woof-dist
          path: |
            dist/
            SHA256SUMS
          retention-days: 14
          if-no-files-found: error

  smoke:
    name: install and import (macos-15, clean venv)
    needs: build
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: metal-woof-dist
      - name: pip install the wheel into a fresh venv, outside any checkout
        env:
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          set -euo pipefail
          /usr/bin/python3 -m venv "$RUNNER_TEMP/smoke"
          "$RUNNER_TEMP/smoke/bin/python" -m pip install --quiet --upgrade pip
          "$RUNNER_TEMP/smoke/bin/python" -m pip install "dist/metal_woof-${VERSION}-py3-none-macosx_14_0_arm64.whl"
      - name: it is metal-woof, at this version, with its bridges and the MLX stack
        working-directory: ${{ runner.temp }}
        env:
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          set -euo pipefail
          "$RUNNER_TEMP/smoke/bin/python" - <<'EOF'
          import os
          import woof
          from woof import bridges
          assert woof.DISTRIBUTION_NAME == "metal-woof", woof.DISTRIBUTION_NAME
          assert woof.__version__ == os.environ["VERSION"], woof.__version__
          staged = sorted(p.name for p in bridges.packaged_bridge_dir().iterdir())
          assert "BUNDLE.json" in staged and len(staged) > 10, staged
          import mlx.core, clang.cindex, nanobind  # the gpu-mlx stack came with it
          print(woof.DISTRIBUTION_NAME, woof.__version__, len(staged), "staged bridges")
          EOF
          "$RUNNER_TEMP/smoke/bin/woof" --help > /dev/null

  publish:
    name: publish to PyPI (metal-woof)
    needs: [build, smoke]
    if: github.event_name == 'push' || inputs.publish
    runs-on: ubuntu-24.04
    environment:
      name: pypi-metal
      url: https://pypi.org/project/metal-woof/
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: metal-woof-dist
      - name: the bytes are the ones the build recorded
        run: |
          set -euo pipefail
          (cd dist && shasum -a 256 -c ../SHA256SUMS)
      - name: publish
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/
          attestations: true
          print-hash: true
