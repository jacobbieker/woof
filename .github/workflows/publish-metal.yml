name: publish-metal

# metal-woof: this source built for Apple silicon and published to PyPI.
#
# A macOS arm64 platform wheel carrying the macOS Rust bridges, with the MLX
# backend's requirements in its base dependencies.  Wheel only: PyPI caps a
# project at 10 GB in total, so no sdist is built or uploaded (the GitHub
# release of each tag carries the source).  The distribution is renamed at
# build time (tools/metal_woof_project.py); recast-woof's own release
# workflows (publish.yml, publish-data.yml) are untouched.  Publishing is
# PyPI trusted publishing: project metal-woof, this workflow file,
# environment pypi-metal (docs/dev/ci.md).
#
# release-metal.yml tags and releases every merge on GitHub, but PyPI gets
# the newest metal-v tag at most once a day: the daily schedule below
# resolves that tag, checks it out, and skips cleanly (no build) when that
# version is already on PyPI.  A tag push (never fired by release-metal.yml,
# whose GITHUB_TOKEN pushes start no workflow) and a manual run still work:
# a tag builds, smoke-tests and publishes X.Y.Z[.N]; a manual run builds and
# smoke-tests the version it is given and publishes only when `publish` is
# ticked.
#
# Concurrency: scheduled and tag runs share one group with cancel-in-progress,
# so only the newest proceeds.  A manual run names an explicit version, so it
# gets its own group per version and is never cancelled by an unrelated
# schedule or tag run (a requested publish is not lost); re-dispatching the
# same version replaces only its own pending run.  skip-existing makes a
# second upload of the same version a no-op rather than an error.

on:
  push:
    tags: ["metal-v*"]
  schedule:
    - cron: "17 4 * * *"   # daily, 04:17 UTC, off-peak
  workflow_dispatch:
    inputs:
      version:
        description: "metal-woof version to build, for example 1.1.3.1"
        required: true
      publish:
        description: "upload the built wheel to PyPI"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ${{ github.event_name == 'workflow_dispatch' && format('publish-metal-dispatch-{0}', inputs.version) || 'publish-metal-newest' }}
  cancel-in-progress: ${{ github.event_name != 'workflow_dispatch' }}

env:
  PIXI_VERSION: v0.81.0
  PYTHONUNBUFFERED: "1"

jobs:
  resolve:
    name: resolve version
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      version: ${{ steps.v.outputs.version }}
      ref: ${{ steps.v.outputs.ref }}
      skip: ${{ steps.v.outputs.skip }}
      publish: ${{ steps.v.outputs.publish }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
      - id: v
        name: the version and ref this run builds, and whether PyPI has it
        env:
          EVENT: ${{ github.event_name }}
          REF: ${{ github.ref }}
          REF_NAME: ${{ github.ref_name }}
          INPUT_VERSION: ${{ inputs.version }}
          INPUT_PUBLISH: ${{ inputs.publish }}
        run: |
          set -euo pipefail
          ref="$REF"
          publish=true
          case "$EVENT" in
            push)
              version="${REF_NAME#metal-v}"
              ;;
            schedule)
              tag="$(git ls-remote --tags --refs origin 'refs/tags/metal-v*' \
                | sed 's|.*refs/tags/||' | sed 's/^metal-v//' | sort -V | tail -n1)"
              if [ -z "$tag" ]; then
                echo "no metal-v tag yet; nothing to publish"
                echo "skip=true" >> "$GITHUB_OUTPUT"
                exit 0
              fi
              version="$tag"
              ref="refs/tags/metal-v${version}"
              ;;
            *)
              version="$INPUT_VERSION"
              publish="$INPUT_PUBLISH"
              ;;
          esac
          if ! printf '%s' "$version" | grep -Eq '^[0-9]+(\.[0-9]+)+$'; then
            echo "::error::version '$version' is not a release number (tag metal-vX.Y.Z[.N])"
            exit 1
          fi
          skip=false
          if [ "$publish" = true ]; then
            code="$(curl -s -o /dev/null -w '%{http_code}' "https://pypi.org/pypi/metal-woof/${version}/json" || true)"
            echo "PyPI metal-woof ${version}: HTTP ${code}"
            if [ "$code" = 200 ]; then
              echo "metal-woof ${version} is already on PyPI; nothing to build"
              skip=true
            fi
          fi
          {
            echo "version=$version"
            echo "ref=$ref"
            echo "skip=$skip"
            echo "publish=$publish"
          } >> "$GITHUB_OUTPUT"

  build:
    name: build (macos-15, arm64)
    needs: resolve
    if: needs.resolve.outputs.skip != 'true'
    runs-on: macos-15
    timeout-minutes: 180
    env:
      # The wheel is tagged macosx_14_0_arm64 (setup.py PLATFORM_TAGS), so
      # every bridge is linked for macOS 14 or newer.
      MACOSX_DEPLOYMENT_TARGET: "14.0"
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.resolve.outputs.ref }}
      - id: version
        name: the version this run builds
        env:
          VERSION: ${{ needs.resolve.outputs.version }}
        run: echo "version=$VERSION" >> "$GITHUB_OUTPUT"
      - uses: prefix-dev/setup-pixi@ad1da6449d9e506fd127fd67ab2d054a769f6a94 # v0.11.2
        with:
          pixi-version: ${{ env.PIXI_VERSION }}
          environments: mlx
          activate-environment: mlx
          locked: true
          cache: true
          cache-write: false
      - id: workspaces
        name: workspaces (the build-native pixi task)
        run: |
          {
            echo 'list<<EOF'
            python .github/ci/build_native.py list | sed 's|.*|tools/& -> target|'
            echo EOF
          } >> "$GITHUB_OUTPUT"
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: ${{ steps.workspaces.outputs.list }}
          # Restores the macOS bridges' build cache that tests.yml's
          # native-macos job saves on main (a run on a tag can read the
          # default branch's caches but saves only for its own tag, so it
          # saves nothing).  Under its own key it never had a cache, and
          # every publish built cold: about 60 of its 65 build minutes.
          prefix-key: v1-rust
          shared-key: native-macos
          save-if: false
      - name: cargo build --release --locked --offline (every build-native workspace)
        run: python .github/ci/build_native.py build
      # The bridges are staged in the checkout, by the pixi env.  The rename
      # happens only in exported copies of the committed tree: the checkout
      # keeps recast-woof's manifest, so pixi (which installs it as the
      # editable recast-woof) stays usable for the whole job.
      - name: stage the macOS bridges into the checkout's package
        run: python tools/stage_wheel_bridges.py --platform macos-arm64
      - name: export the tree and rename the copy to metal-woof
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          dir="$RUNNER_TEMP/metal-wheel"
          rm -rf "$dir" && mkdir -p "$dir"
          git archive HEAD | tar -x -C "$dir"
          python tools/metal_woof_project.py --version "$VERSION" "$dir/pyproject.toml"
          # The copy carries the staged bridges.
          mkdir -p "$RUNNER_TEMP/metal-wheel/woof/libexec"
          cp -R woof/libexec/bridges "$RUNNER_TEMP/metal-wheel/woof/libexec/"
      - id: py
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          # macOS's own /usr/bin/python3 is 3.9; the package needs >= 3.11.
          python-version: "3.13"
          update-environment: false
      - name: a clean build environment
        run: |
          "${{ steps.py.outputs.python-path }}" -m venv "$RUNNER_TEMP/build-env"
          "$RUNNER_TEMP/build-env/bin/python" -m pip install --quiet --upgrade pip build
      - name: platform wheel (from the staged copy; no sdist, see the header)
        run: "\"$RUNNER_TEMP/build-env/bin/python\" -m build --wheel --outdir \"$GITHUB_WORKSPACE/dist\" \"$RUNNER_TEMP/metal-wheel\""
      - name: the distribution is metal-woof's, and the wheel is macOS arm64
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          ls -l dist
          test -f "dist/metal_woof-${VERSION}-py3-none-macosx_14_0_arm64.whl"
          test "$(find dist -mindepth 1 -maxdepth 1 | wc -l | tr -d ' ')" = 1
          (cd dist && shasum -a 256 ./* | tee ../SHA256SUMS)
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: metal-woof-dist
          path: |
            dist/
            SHA256SUMS
          retention-days: 14
          if-no-files-found: error

  smoke:
    name: install and import (macos-15, clean venv)
    needs: build
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: metal-woof-dist
      - id: py
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          # macOS's own /usr/bin/python3 is 3.9; the package needs >= 3.11.
          python-version: "3.13"
          update-environment: false
      - name: pip install the wheel into a fresh venv, outside any checkout
        env:
          VERSION: ${{ needs.resolve.outputs.version }}
        run: |
          set -euo pipefail
          "${{ steps.py.outputs.python-path }}" -m venv "$RUNNER_TEMP/smoke"
          "$RUNNER_TEMP/smoke/bin/python" -m pip install --quiet --upgrade pip
          "$RUNNER_TEMP/smoke/bin/python" -m pip install "dist/metal_woof-${VERSION}-py3-none-macosx_14_0_arm64.whl"
      - name: it is metal-woof, at this version, with its bridges and the MLX stack
        working-directory: ${{ runner.temp }}
        env:
          VERSION: ${{ needs.resolve.outputs.version }}
        run: |
          set -euo pipefail
          "$RUNNER_TEMP/smoke/bin/python" - <<'EOF'
          import os
          import woof
          from woof import bridges
          assert woof.DISTRIBUTION_NAME == "metal-woof", woof.DISTRIBUTION_NAME
          assert woof.__version__ == os.environ["VERSION"], woof.__version__
          staged = sorted(p.name for p in bridges.packaged_bridge_dir().iterdir())
          assert "BUNDLE.json" in staged and len(staged) > 10, staged
          import mlx.core, clang.cindex, nanobind  # the gpu-mlx stack came with it
          print(woof.DISTRIBUTION_NAME, woof.__version__, len(staged), "staged bridges")
          EOF
          "$RUNNER_TEMP/smoke/bin/woof" --help > /dev/null

  publish:
    name: publish to PyPI (metal-woof)
    needs: [resolve, build, smoke]
    if: needs.resolve.outputs.publish == 'true'
    runs-on: ubuntu-24.04
    environment:
      name: pypi-metal
      url: https://pypi.org/project/metal-woof/
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: metal-woof-dist
      - name: the bytes are the ones the build recorded
        run: |
          set -euo pipefail
          (cd dist && shasum -a 256 -c ../SHA256SUMS)
      - name: publish
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/
          skip-existing: true
          attestations: true
          print-hash: true
